# CBSL Macro-Financial & Energy Grid Forecasting Configuration

data:
  raw_pdf_dir: "raw_pdfs"
  processed_csv_path: "data/processed/cbsl_daily_economic_indicators_2020_2026_preprocesd.csv"
  fallback_csv_path: "cbsl_daily_economic_indicators_2020_2026_preprocesd.csv"
  date_column: "report_date"

columns:
  energy_generation:
    - "hydro_pct"
    - "thermal_coal_pct"
    - "thermal_oil_pct"
    - "wind_pct"
  macro_economic:
    - "usd_tt_selling"
    - "usd_tt_buying"
    - "indicative_usd_spot"
    - "gold_price"
    - "overnight_liquidity"
    - "aspi"
    - "sp_sl20"
    - "real_gdp_growth"
    - "ncpi_yoy"
    - "ccpi_yoy"
  grid_metrics:
    - "peak_demand"
    - "total_energy"

models:
  demand_forecasting:
    model_type: "Lasso"
    alpha: 0.2
    random_state: 42
    target: "demand_delta_target"
    feature_columns:
      - "demand_diff1"
      - "demand_diff7"
      - "energy_lag1"
      - "hydro_lag1"
      - "sin_dow"
      - "cos_dow"
  regime_clustering:
    n_clusters: 3
    random_state: 42
    n_init: 10
    pca_components: 2
    features:
      - "usd_tt_selling"
      - "peak_demand"
      - "total_energy"
      - "hydro_pct"
      - "thermal_coal_pct"

visualization:
  theme: "plotly_white"
  font_family: "Inter, sans-serif"
  font_color: "#0f172a"
  sources:
    hydro_pct:
      label: "Hydro"
      color: "#3b82f6"
    thermal_coal_pct:
      label: "Coal"
      color: "#475569"
    thermal_oil_pct:
      label: "Fuel Oil"
      color: "#dc2626"
    wind_pct:
      label: "Wind"
      color: "#16a34a"
