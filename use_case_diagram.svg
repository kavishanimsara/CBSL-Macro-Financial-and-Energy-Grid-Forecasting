<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ucGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" fill="#F8FAFC"/>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1120" height="75" rx="14" fill="url(#headerGrad)" filter="url(#shadow-lg)"/>
  <text x="600" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold">CBSL Macro-Financial &amp; Energy Grid System Use Case Diagram</text>
  <text x="600" y="90" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="13" font-weight="500">System Actor Interactions &amp; Functional Use Case Boundaries (`app.py` Platform)</text>

  <!-- SYSTEM BOUNDARY BOX -->
  <g filter="url(#shadow)">
    <rect x="290" y="125" width="620" height="775" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4"/>
    <rect x="290" y="125" width="620" height="40" rx="16" fill="#2563EB"/>
    <!-- Square bottom corners for header fill -->
    <rect x="290" y="145" width="620" height="20" fill="#2563EB"/>
    <text x="600" y="150" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="15" font-weight="bold">SYSTEM BOUNDARY: CBSL &amp; CEB ANALYTICS PLATFORM</text>
  </g>

  <!-- ==================== LEFT ACTORS ==================== -->
  
  <!-- Actor 1: Central Bank Economist -->
  <g transform="translate(130, 240)">
    <circle cx="0" cy="-25" r="16" fill="#1E3A8A"/>
    <line x1="0" y1="-9" x2="0" y2="25" stroke="#1E3A8A" stroke-width="4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#1E3A8A" stroke-width="4"/>
    <line x1="0" y1="25" x2="-15" y2="55" stroke="#1E3A8A" stroke-width="4"/>
    <line x1="0" y1="25" x2="15" y2="55" stroke="#1E3A8A" stroke-width="4"/>
    <text x="0" y="75" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Central Bank Economist</text>
    <text x="0" y="92" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">(Monetary Policy Analyst)</text>
  </g>

  <!-- Actor 2: CEB Power Grid Operator -->
  <g transform="translate(130, 490)">
    <circle cx="0" cy="-25" r="16" fill="#4338CA"/>
    <line x1="0" y1="-9" x2="0" y2="25" stroke="#4338CA" stroke-width="4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#4338CA" stroke-width="4"/>
    <line x1="0" y1="25" x2="-15" y2="55" stroke="#4338CA" stroke-width="4"/>
    <line x1="0" y1="25" x2="15" y2="55" stroke="#4338CA" stroke-width="4"/>
    <text x="0" y="75" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">CEB Grid Operator</text>
    <text x="0" y="92" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">(Energy System Analyst)</text>
  </g>

  <!-- Actor 3: Financial & Equity Analyst -->
  <g transform="translate(130, 740)">
    <circle cx="0" cy="-25" r="16" fill="#047857"/>
    <line x1="0" y1="-9" x2="0" y2="25" stroke="#047857" stroke-width="4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#047857" stroke-width="4"/>
    <line x1="0" y1="25" x2="-15" y2="55" stroke="#047857" stroke-width="4"/>
    <line x1="0" y1="25" x2="15" y2="55" stroke="#047857" stroke-width="4"/>
    <text x="0" y="75" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Equity Market Analyst</text>
    <text x="0" y="92" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">(Capital Market Trader)</text>
  </g>

  <!-- ==================== RIGHT ACTORS ==================== -->

  <!-- Actor 4: External Trade Analyst -->
  <g transform="translate(1070, 360)">
    <circle cx="0" cy="-25" r="16" fill="#6D28D9"/>
    <line x1="0" y1="-9" x2="0" y2="25" stroke="#6D28D9" stroke-width="4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#6D28D9" stroke-width="4"/>
    <line x1="0" y1="25" x2="-15" y2="55" stroke="#6D28D9" stroke-width="4"/>
    <line x1="0" y1="25" x2="15" y2="55" stroke="#6D28D9" stroke-width="4"/>
    <text x="0" y="75" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">External Sector Analyst</text>
    <text x="0" y="92" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">(Trade &amp; Reserves Specialist)</text>
  </g>

  <!-- Actor 5: System Admin / Data Engineer -->
  <g transform="translate(1070, 650)">
    <circle cx="0" cy="-25" r="16" fill="#B45309"/>
    <line x1="0" y1="-9" x2="0" y2="25" stroke="#B45309" stroke-width="4"/>
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#B45309" stroke-width="4"/>
    <line x1="0" y1="25" x2="-15" y2="55" stroke="#B45309" stroke-width="4"/>
    <line x1="0" y1="25" x2="15" y2="55" stroke="#B45309" stroke-width="4"/>
    <text x="0" y="75" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="13" font-weight="bold">System Administrator</text>
    <text x="0" y="92" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="11">(Data Pipeline Engineer)</text>
  </g>

  <!-- ==================== USE CASE OVALS ==================== -->

  <!-- UC 1: Filter Multi-Year & Monthly Datasets -->
  <g transform="translate(600, 195)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-01: Filter Multi-Year &amp; Monthly Cohorts</text>
  </g>

  <!-- UC 2: Analyze CCPI Inflation & Policy Corridor -->
  <g transform="translate(600, 270)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#3B82F6" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-02: Analyze CCPI Inflation &amp; Policy Rates</text>
  </g>

  <!-- UC 3: Forecast System Peak Load (MW) -->
  <g transform="translate(600, 345)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#6366F1" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-03: Forecast System Peak Electricity Load (MW)</text>
  </g>

  <!-- UC 4: Decompose Generation Fuel Mix -->
  <g transform="translate(600, 420)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#6366F1" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-04: Decompose Hydro vs Thermal Generation Mix</text>
  </g>

  <!-- UC 5: Predict Daily ASPI Market Direction -->
  <g transform="translate(600, 495)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#10B981" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-05: Predict Daily ASPI Equity Trend Direction</text>
  </g>

  <!-- UC 6: Monitor 30-Day Rolling Volatility -->
  <g transform="translate(600, 570)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#10B981" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-06: Monitor 30-Day ASPI Rolling Volatility</text>
  </g>

  <!-- UC 7: Track Gross Reserves & Trade Balance -->
  <g transform="translate(600, 645)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#8B5CF6" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-07: Track Gross Reserves &amp; Trade Balance</text>
  </g>

  <!-- UC 8: Trigger PDF OCR Scrapers & Data Pipeline -->
  <g transform="translate(600, 720)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-08: Trigger Automated PDF Scraping Pipeline</text>
  </g>

  <!-- UC 9: Retrain Multi-Track Machine Learning Models -->
  <g transform="translate(600, 795)" filter="url(#shadow)">
    <ellipse cx="0" cy="0" rx="210" ry="24" fill="url(#ucGrad)" stroke="#F59E0B" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">UC-09: Retrain Multi-Track Predictive Models</text>
  </g>

  <!-- ==================== RELATIONSHIP CONNECTOR LINES ==================== -->

  <!-- Economist (Actor 1) -> UC 1, UC 2 -->
  <line x1="165" y1="230" x2="390" y2="195" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="240" x2="390" y2="270" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Grid Operator (Actor 2) -> UC 1, UC 3, UC 4 -->
  <line x1="165" y1="480" x2="390" y2="195" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="490" x2="390" y2="345" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="165" y1="500" x2="390" y2="420" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Equity Analyst (Actor 3) -> UC 1, UC 5, UC 6 -->
  <line x1="165" y1="730" x2="390" y2="195" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="165" y1="740" x2="390" y2="495" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="165" y1="750" x2="390" y2="570" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- External Analyst (Actor 4) -> UC 1, UC 7 -->
  <line x1="1035" y1="350" x2="810" y2="195" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1035" y1="360" x2="810" y2="645" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- System Admin (Actor 5) -> UC 8, UC 9 -->
  <line x1="1035" y1="640" x2="810" y2="720" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="1035" y1="650" x2="810" y2="795" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Footer Info -->
  <text x="600" y="932" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="11" font-style="italic">Capstone Project II | Department of Data Science | CBSL Macro-Financial &amp; Energy Grid Forecasting Framework</text>

</svg>
