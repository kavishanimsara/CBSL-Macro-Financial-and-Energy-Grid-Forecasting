<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>

    <!-- Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="950" fill="#F8FAFC"/>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1120" height="90" rx="16" fill="url(#headerGrad)" filter="url(#shadow-lg)"/>
  <text x="600" y="70" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CBSL Macro-Financial &amp; Energy Grid Forecasting Framework</text>
  <text x="600" y="98" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14" font-weight="500">End-to-End Methodological Architecture &amp; Multi-Track Machine Learning Pipeline</text>

  <!-- PHASE 1: DATA INGESTION -->
  <g transform="translate(40, 150)" filter="url(#shadow)">
    <rect width="1120" height="130" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 1108 0 A 12 12 0 0 1 1120 12 L 1120 36 L 0 36 Z" fill="#2563EB"/>
    <text x="20" y="24" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 1: MULTI-SOURCE DATA INGESTION LAYER</text>
    <text x="1100" y="24" text-anchor="end" fill="#DBEAFE" font-family="Arial, sans-serif" font-size="12">Raw Temporal Collections (2018–2024)</text>

    <!-- Content Items -->
    <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
      <text x="30" y="65"><tspan font-weight="bold" fill="#1E40AF">• CBSL Economic Reports:</tspan> Inflation Indices (CCPI Headline/Core), SDFR/SLFR Policy Rates, Broad Money (M2b), 3M T-Bills</text>
      <text x="30" y="90"><tspan font-weight="bold" fill="#1E40AF">• CEB Power Grid Operations:</tspan> System Peak Demand (MW), Daily Gross Generation Mix (Hydro, Thermal, Solar PV, Wind)</text>
      <text x="30" y="115"><tspan font-weight="bold" fill="#1E40AF">• External Sector &amp; CSE Equities:</tspan> Trade Balance, Remittances, Tourist Arrivals, ASPI Index, Brent Crude &amp; Singapore Gasoil</text>
    </g>
  </g>

  <!-- ARROW 1 -->
  <line x1="600" y1="280" x2="600" y2="310" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="520" y="287" width="160" height="20" rx="4" fill="#E2E8F0"/>
  <text x="600" y="301" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Raw Time-Series Data Inflow</text>

  <!-- PHASE 2: PREPROCESSING & STATIONARITY -->
  <g transform="translate(40, 315)" filter="url(#shadow)">
    <rect width="1120" height="130" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 1108 0 A 12 12 0 0 1 1120 12 L 1120 36 L 0 36 Z" fill="#7C3AED"/>
    <text x="20" y="24" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 2: DATA CLEANING, ANOMALY REPAIR &amp; ADF STATIONARITY DIAGNOSTICS</text>
    <text x="1100" y="24" text-anchor="end" fill="#EDE9FE" font-family="Arial, sans-serif" font-size="12">Automated OCR &amp; Dickey-Fuller Testing</text>

    <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
      <text x="30" y="65"><tspan font-weight="bold" fill="#5B21B6">• PDF OCR Extraction Routine:</tspan> Automated table parsing via pdfplumber &amp; regular expression string parsing</text>
      <text x="30" y="90"><tspan font-weight="bold" fill="#5B21B6">• Anomaly Repair &amp; Spline Imputation:</tspan> Outlier filtering via Z-score thresholds (|Z| &gt; 3.5) &amp; linear moving splines</text>
      <text x="30" y="115"><tspan font-weight="bold" fill="#5B21B6">• ADF Stationarity Testing:</tspan> Evaluates unit root H0: γ=0; non-stationary I(1) series converted via 1st Difference Log Δln(Yt)</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <line x1="600" y1="445" x2="600" y2="475" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="452" width="200" height="20" rx="4" fill="#E2E8F0"/>
  <text x="600" y="466" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Stationary &amp; Repaired Datasets</text>

  <!-- PHASE 3: ZERO-LOOKAHEAD FEATURE PIPELINE -->
  <g transform="translate(40, 480)" filter="url(#shadow)">
    <rect width="1120" height="125" rx="12" fill="#FFFFFF" stroke="#F97316" stroke-width="2"/>
    <path d="M 0 12 A 12 12 0 0 1 12 0 L 1108 0 A 12 12 0 0 1 1120 12 L 1120 36 L 0 36 Z" fill="#EA580C"/>
    <text x="20" y="24" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 3: ZERO-LOOKAHEAD FEATURE ENGINEERING PIPELINE</text>
    <text x="1100" y="24" text-anchor="end" fill="#FFEDD5" font-family="Arial, sans-serif" font-size="12">Strict Data Leakage Prevention</text>

    <g font-family="Arial, sans-serif" font-size="13" fill="#334155">
      <text x="30" y="63"><tspan font-weight="bold" fill="#C2410C">• Autoregressive Lags:</tspan> Computes past temporal features (t-1, t-2, ..., t-6) strictly avoiding future lookahead bias</text>
      <text x="30" y="86"><tspan font-weight="bold" fill="#C2410C">• Past-Only Rolling Aggregations:</tspan> Calculates 3-month rolling averages, standard deviations, and 6-month peak maximums</text>
      <text x="30" y="109"><tspan font-weight="bold" fill="#C2410C">• Exogenous Corridor Alignment:</tspan> Synchronizes policy interest rate shifts and international fuel import benchmarks</text>
    </g>
  </g>

  <!-- ARROWS TO 4 TRACKS -->
  <line x1="175" y1="605" x2="175" y2="635" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="458" y1="605" x2="458" y2="635" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="742" y1="605" x2="742" y2="635" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1025" y1="605" x2="1025" y2="635" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- PHASE 4: 4 MODELING TRACKS -->
  <g transform="translate(40, 640)">
    
    <!-- Track 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="265" height="195" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 255 0 A 10 10 0 0 1 265 10 L 265 32 L 0 32 Z" fill="#059669"/>
      <text x="132" y="21" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">TRACK 1: MACRO-FINANCIAL</text>
      <text x="132" y="52" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">CCPI Inflation Rate</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
        <text x="15" y="76">• Model: SARIMAX + Ridge</text>
        <text x="15" y="96">• Order: (1,1,1)(1,1,1) s=12</text>
        <text x="15" y="116">• Exog: SDFR, SLFR, M2b</text>
        <text x="15" y="136">• Protocol: Walk-Forward CV</text>
        <rect x="15" y="152" width="235" height="28" rx="6" fill="#ECFDF5"/>
        <text x="132" y="171" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Metric: RMSE = 0.84%</text>
      </g>
    </g>

    <!-- Track 2 -->
    <g transform="translate(285, 0)" filter="url(#shadow)">
      <rect width="265" height="195" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 255 0 A 10 10 0 0 1 265 10 L 265 32 L 0 32 Z" fill="#059669"/>
      <text x="132" y="21" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">TRACK 2: ENERGY GRID</text>
      <text x="132" y="52" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">System Peak Load (MW)</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
        <text x="15" y="76">• Model: Delta-Lasso + XGBoost</text>
        <text x="15" y="96">• Sparsity: L1 Penalty (α=0.015)</text>
        <text x="15" y="116">• Features: Generation Mix</text>
        <text x="15" y="136">• Protocol: Out-of-Time Test</text>
        <rect x="15" y="152" width="235" height="28" rx="6" fill="#ECFDF5"/>
        <text x="132" y="171" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Metric: MAE = 38.4 MW</text>
      </g>
    </g>

    <!-- Track 3 -->
    <g transform="translate(570, 0)" filter="url(#shadow)">
      <rect width="265" height="195" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 255 0 A 10 10 0 0 1 265 10 L 265 32 L 0 32 Z" fill="#059669"/>
      <text x="132" y="21" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">TRACK 3: EXTERNAL SECTOR</text>
      <text x="132" y="52" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Gross Official Reserves</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
        <text x="15" y="76">• Model: VAR(3) + LSTM</text>
        <text x="15" y="96">• Setup: 64 Units | Dropout 0.2</text>
        <text x="15" y="116">• Exog: Remittances &amp; Brent</text>
        <text x="15" y="136">• Protocol: Rolling Window</text>
        <rect x="15" y="152" width="235" height="28" rx="6" fill="#ECFDF5"/>
        <text x="132" y="171" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Metric: MAPE = 2.15%</text>
      </g>
    </g>

    <!-- Track 4 -->
    <g transform="translate(855, 0)" filter="url(#shadow)">
      <rect width="265" height="195" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 255 0 A 10 10 0 0 1 265 10 L 265 32 L 0 32 Z" fill="#059669"/>
      <text x="132" y="21" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="bold">TRACK 4: CAPITAL MARKET</text>
      <text x="132" y="52" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">ASPI Trend Direction</text>
      <g font-family="Arial, sans-serif" font-size="11" fill="#334155">
        <text x="15" y="76">• Model: GARCH(1,1) + RF</text>
        <text x="15" y="96">• Volatility: Conditional σt²</text>
        <text x="15" y="116">• Trees: 250 Trees | Depth 5</text>
        <text x="15" y="136">• Protocol: 5-Fold Stratified</text>
        <rect x="15" y="152" width="235" height="28" rx="6" fill="#ECFDF5"/>
        <text x="132" y="171" text-anchor="middle" fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Metric: Accuracy = 81.06%</text>
      </g>
    </g>

  </g>

  <!-- PHASE 5: STREAMLIT ANALYTICAL UI FOOTER -->
  <g transform="translate(40, 855)" filter="url(#shadow)">
    <rect width="1120" height="55" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="20" y="32" fill="#1E293B" font-family="Arial, sans-serif" font-size="12" font-weight="bold">PHASE 5: DEPLOYMENT &amp; ANALYTICAL DASHBOARD (app.py)</text>
    <text x="440" y="32" fill="#64748B" font-family="Arial, sans-serif" font-size="11">Streamlit 1.32 | High-Contrast White Theme | Multi-Year &amp; Monthly Filters | Plotly Interactive Visuals</text>
  </g>

  <!-- Footer Metadata -->
  <text x="600" y="935" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="11" font-style="italic">Capstone Project II | Department of Data Science | CBSL Macro-Financial &amp; Energy Grid Forecasting Framework</text>

</svg>
